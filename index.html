<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Beatriz 🌻</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* =========================
           PANTALLA INICIAL
        ========================= */

        #inicio {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;

            background: linear-gradient(
                120deg,
                #ff9a9e,
                #fad0c4,
                #a18cd1,
                #84fab0,
                #8fd3f4
            );

            background-size: 400% 400%;
            animation: fondo 10s ease infinite;
        }

        @keyframes fondo {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .hola {
            font-size: clamp(60px, 15vw, 130px);
            font-weight: bold;
            color: white;
            text-shadow:
                4px 4px 0 #ff4d6d,
                8px 8px 0 #6c5ce7;
            animation: saltar 1.5s infinite alternate;
        }

        @keyframes saltar {
            from {
                transform: translateY(0) rotate(-2deg);
            }

            to {
                transform: translateY(-15px) rotate(2deg);
            }
        }

        .subtitulo {
            margin-top: 20px;
            font-size: clamp(20px, 5vw, 32px);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px #555;
        }

        .boton {
            margin-top: 35px;
            padding: 18px 30px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: botonBrillo 2s infinite;
        }

        .boton:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }

        @keyframes botonBrillo {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* =========================
           PANTALLA DE LAS FLORES
        ========================= */

        #flores {
            display: none;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 40px 20px;

            background: linear-gradient(
                135deg,
                #fff3a3,
                #ffd6e7,
                #c7f9cc,
                #bde0fe
            );

            background-size: 400% 400%;
            animation: fondoFlores 12s ease infinite;
        }

        @keyframes fondoFlores {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .titulo {
            position: relative;
            z-index: 10;
            font-size: clamp(32px, 8vw, 65px);
            color: #ff8c00;
            text-shadow:
                3px 3px 0 white,
                5px 5px 0 #f9c74f;
            animation: tituloAnimado 2s infinite alternate;
        }

        @keyframes tituloAnimado {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }

        .amistad {
            position: relative;
            z-index: 10;
            margin-top: 15px;
            font-size: clamp(20px, 5vw, 30px);
            color: #6c5ce7;
            font-weight: bold;
        }

        /* =========================
           RAMO
        ========================= */

        .ramo {
            position: relative;
            width: 350px;
            height: 450px;
            max-width: 90vw;
            margin: 25px auto 0;
        }

        /* Tallos */

        .tallo {
            position: absolute;
            width: 8px;
            height: 230px;
            background: #3a9d23;
            bottom: 120px;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
        }

        .tallo1 {
            transform: rotate(-25deg);
        }

        .tallo2 {
            transform: rotate(-12deg);
        }

        .tallo3 {
            transform: rotate(0deg);
        }

        .tallo4 {
            transform: rotate(12deg);
        }

        .tallo5 {
            transform: rotate(25deg);
        }

        /* Hojas */

        .hoja {
            position: absolute;
            width: 45px;
            height: 22px;
            background: #45a829;
            border-radius: 100% 0 100% 0;
        }

        .hoja1 {
            left: 85px;
            bottom: 210px;
            transform: rotate(25deg);
        }

        .hoja2 {
            left: 105px;
            bottom: 170px;
            transform: rotate(-30deg);
        }

        .hoja3 {
            right: 90px;
            bottom: 200px;
            transform: rotate(-20deg);
        }

        .hoja4 {
            right: 105px;
            bottom: 160px;
            transform: rotate(30deg);
        }

        /* Flores */

        .flor {
            position: absolute;
            width: 95px;
            height: 95px;
            animation: florFlotando 2.5s ease-in-out infinite alternate;
        }

        .flor1 {
            left: 30px;
            top: 80px;
            animation-delay: 0s;
        }

        .flor2 {
            left: 100px;
            top: 30px;
            animation-delay: .3s;
        }

        .flor3 {
            left: 130px;
            top: 90px;
            animation-delay: .6s;
        }

        .flor4 {
            right: 85px;
            top: 35px;
            animation-delay: .9s;
        }

        .flor5 {
            right: 25px;
            top: 90px;
            animation-delay: 1.2s;
        }

        @keyframes florFlotando {
            from {
                transform: translateY(0) rotate(-3deg);
            }

            to {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        .petalo {
            position: absolute;
            width: 35px;
            height: 50px;
            background: #ffd21f;
            border-radius: 50%;
            left: 30px;
            top: 22px;
            transform-origin: 18px 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .p1 {
            transform: rotate(0deg) translateY(-20px);
        }

        .p2 {
            transform: rotate(45deg) translateY(-20px);
        }

        .p3 {
            transform: rotate(90deg) translateY(-20px);
        }

        .p4 {
            transform: rotate(135deg) translateY(-20px);
        }

        .p5 {
            transform: rotate(180deg) translateY(-20px);
        }

        .p6 {
            transform: rotate(225deg) translateY(-20px);
        }

        .p7 {
            transform: rotate(270deg) translateY(-20px);
        }

        .p8 {
            transform: rotate(315deg) translateY(-20px);
        }

        .centro {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #8b5a00;
            left: 30px;
            top: 30px;
            z-index: 5;
            box-shadow: inset 0 0 0 5px #6d4300;
        }

        /* Papel del ramo */

        .papel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 230px;
            height: 150px;
            background: linear-gradient(
                135deg,
                #fff,
                #ffe6b3
            );
            clip-path: polygon(
                10% 0%,
                90% 0%,
                100% 100%,
                50% 75%,
                0% 100%
            );
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .cinta {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 35px;
            background: #ff69b4;
            border-radius: 50%;
            z-index: 10;
        }

        .cinta::before,
        .cinta::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 30px;
            background: #ff69b4;
            top: 5px;
        }

        .cinta::before {
            right: 50px;
            transform: rotate(25deg);
            border-radius: 10px 50% 50% 10px;
        }

        .cinta::after {
            left: 50px;
            transform: rotate(-25deg);
            border-radius: 50% 10px 10px 50%;
        }

        /* =========================
           MENSAJE
        ========================= */

        .mensaje {
            position: relative;
            z-index: 20;
            max-width: 700px;
            margin: -5px auto 0;
            padding: 20px;
            font-size: clamp(18px, 4vw, 25px);
            color: #444;
            font-weight: bold;
            line-height: 1.6;
            background: rgba(255,255,255,0.65);
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            backdrop-filter: blur(5px);
        }

        .mensaje .internet {
            display: block;
            margin-top: 8px;
            color: #6c5ce7;
        }

        /* =========================
           PÉTALOS CAYENDO
        ========================= */

        .petalos-caida {
            position: fixed;
            top: -50px;
            font-size: 25px;
            animation: caer linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        .caida1 {
            left: 10%;
            animation-duration: 7s;
        }

        .caida2 {
            left: 25%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .caida3 {
            left: 45%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .caida4 {
            left: 65%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .caida5 {
            left: 85%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .ramo {
                transform: scale(0.85);
                margin-top: 5px;
                margin-bottom: -30px;
            }

            .mensaje {
                margin-top: -10px;
            }

            .boton {
                font-size: 17px;
                padding: 15px 23px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         PANTALLA INICIAL
    ========================= -->

        <div class="hola">

            <!-- Flor 2 -->

            <div class="flor flor2">

                <div class="petalo p1"></div>
                <div class="petalo p2"></div>
                <div class="petalo p3"></div>
                <div class="petalo p4"></div>
                <div class="petalo p5"></div>
                <div class="petalo p6"></div>

                <div class="petalo p8"></div>

                <div class="centro"></div>

            </div>


            <!-- Flor 3 -->

            <div class="flor flor3">

                <div class="petalo p1"></div>
                <div class="petalo p2"></div>
                <div class="petalo p3"></div>
                <div class="petalo p4"></div>
                <div class="petalo p5"></div>
                <div class="petalo p6"></div>
                <div class="petalo p7"></div>
                <div class="petalo p8"></div>

                <div class="centro"></div>

            </div>


            <!-- Flor 4 -->

            <div class="flor flor4">

                <div class="petalo p1"></div>
                <div class="petalo p2"></div>

            <div class="flor flor5">

            <!-- Papel -->

        <!-- MENSAJE -->

        <div class="mensaje">

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function mostrarFlores() {

            document.getElementById("inicio").style.display = "none";

            document.getElementById("flores").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    </script>

</body>
</html>
