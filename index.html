<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un detalle para ti 🌻</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff176,
                    #81d4fa,
                    #ce93d8,
                    #ffcc80
                );

            background-size: 400% 400%;
            animation: fondo 10s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           PANTALLA INICIAL
        ========================= */

        #inicio {
            text-align: center;
            animation: entrada 1.5s ease;
        }

        .hola {
            font-size: 75px;
            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ff5252,
                    #ff9800,
                    #ffeb3b,
                    #4caf50,
                    #2196f3,
                    #9c27b0
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation:
                colores 4s linear infinite,
                flotar 2s ease-in-out infinite;

            text-shadow:
                0 8px 20px rgba(0,0,0,.12);
        }

        .detalle {
            font-size: 24px;
            color: #ffffff;

            text-shadow:
                0 3px 8px rgba(0,0,0,.3);

            margin-top: -10px;
            margin-bottom: 35px;

            animation: aparecer 2s ease;
        }

        .boton {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #ffca28,
                    #ff9800
                );

            color: white;

            padding: 17px 30px;

            border-radius: 50px;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0,0,0,.2);

            transition: .3s;

            animation:
                aparecer 2.5s ease,
                pulso 2s infinite;
        }

        .boton:hover {
            transform: scale(1.1);
        }

        /* =========================
           SEGUNDA PANTALLA
        ========================= */

        #sorpresa {
            display: none;

            width: 100%;
            height: 100vh;

            text-align: center;

            position: relative;
        }

        #sorpresa.mostrar {
            display: block;
            animation: aparecer 1.5s ease;
        }

        .titulo {
            margin-top: 45px;

            font-size: 40px;
            font-weight: bold;

            color: #fff;

            text-shadow:
                0 4px 10px rgba(0,0,0,.3);

            animation:
                tituloEntrada 1.5s ease,
                flotar 3s ease-in-out infinite;
        }

        .subtitulo {
            color: white;
            font-size: 19px;

            text-shadow:
                0 3px 7px rgba(0,0,0,.3);
        }

        /* =========================
           RAMO
        ========================= */

        .ramo {
            position: relative;

            width: 360px;
            height: 430px;

            margin: 5px auto 0;
        }

        /* TALLOS */

        .tallo {
            position: absolute;

            width: 9px;
            height: 220px;

            background:
                linear-gradient(
                    90deg,
                    #2e7d32,
                    #66bb6a
                );

            bottom: 40px;
            left: 175px;

            border-radius: 10px;

            transform-origin: bottom;

            transform: rotate(-8deg);

            animation: crecerTallo 1.5s ease forwards;
        }

        .tallo2 {
            transform: rotate(8deg);
        }

        .tallo3 {
            transform: rotate(0deg);
        }

        /* HOJAS */

        .hoja {
            position: absolute;

            width: 85px;
            height: 38px;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #66bb6a
                );

            border-radius: 100% 0;

            opacity: 0;

            animation: hojaEntrada 1s forwards;
        }

        .hoja1 {
            left: 60px;
            bottom: 130px;

            transform: rotate(25deg);

            animation-delay: 1s;
        }

        .hoja2 {
            right: 55px;
            bottom: 160px;

            transform: rotate(-25deg);

            animation-delay: 1.2s;
        }

        .hoja3 {
            left: 90px;
            bottom: 85px;

            transform: rotate(-20deg);

            animation-delay: 1.4s;
        }

        /* =========================
           FLORES
        ========================= */

        .flor {
            position: absolute;

            width: 70px;
            height: 70px;

            background: #ffd600;

            border-radius: 50%;

            box-shadow:

                0 -30px 0 #ffea00,
                0 30px 0 #ffea00,
                30px 0 0 #ffea00,
                -30px 0 0 #ffea00,

                21px 21px 0 #ffd600,
                -21px 21px 0 #ffd600,
                21px -21px 0 #ffd600,
                -21px -21px 0 #ffd600;

            transform: scale(0);

            animation:
                florEntrada .9s forwards;
        }

        .flor::after {
            content: "";

            position: absolute;

            width: 38px;
            height: 38px;

            left: 16px;
            top: 16px;

            background:
                radial-gradient(
                    circle,
                    #4e342e,
                    #795548,
                    #3e2723
                );

            border-radius: 50%;

            box-shadow:
                inset 0 0 8px #000;
        }

        .flor1 {
            top: 25px;
            left: 145px;

            animation-delay: .3s;
        }

        .flor2 {
            top: 100px;
            left: 55px;

            animation-delay: .6s;
        }

        .flor3 {
            top: 100px;
            right: 55px;

            animation-delay: .9s;
        }

        .flor4 {
            top: 180px;
            left: 105px;

            animation-delay: 1.2s;
        }

        .flor5 {
            top: 180px;
            right: 90px;

            animation-delay: 1.5s;
        }

        .flor6 {
            top: 130px;
            left: 145px;

            transform: scale(.7);

            animation-delay: 1.8s;
        }

        /* =========================
           PAPEL DEL RAMO
        ========================= */

        .papel {
            position: absolute;

            width: 250px;
            height: 130px;

            bottom: 5px;
            left: 55px;

            background:
                linear-gradient(
                    135deg,
                    #d7a64a,
                    #f3d078
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    78% 100%,
                    22% 100%
                );

            z-index: 10;

            animation:
                papelEntrada 1s ease;
        }

        /* LAZO */

        .lazo {
            position: absolute;

            width: 95px;
            height: 45px;

            bottom: 5px;
            left: 132px;

            background: #ffc107;

            border-radius: 50%;

            z-index: 20;

            box-shadow:
                0 4px 8px rgba(0,0,0,.2);
        }

        .lazo::before,
        .lazo::after {
            content: "";

            position: absolute;

            width: 65px;
            height: 45px;

            background: #ffca28;

            top: 0;

            border-radius: 50%;
        }

        .lazo::before {
            right: 60px;
            transform: rotate(-20deg);
        }

        .lazo::after {
            left: 60px;
            transform: rotate(20deg);
        }

        /* =========================
           MENSAJE
        ========================= */

        .mensaje {

            display: inline-block;

            margin-top: -20px;

            padding: 15px 28px;

            background:
                rgba(255,255,255,.85);

            border-radius: 25px;

            color: #7b5b00;

            font-size: 21px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(0,0,0,.15);

            animation:
                mensajeEntrada 1.5s ease;
        }

        /* =========================
           PÉTALOS
        ========================= */

        .petalo {
            position: fixed;

            top: -30px;

            font-size: 25px;

            pointer-events: none;

            animation:
                caer linear forwards;

            z-index: 100;
        }

        /* =========================
           ANIMACIONES
        ========================= */

        @keyframes fondo {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes colores {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        @keyframes flotar {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes entrada {

            from {
                opacity: 0;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes aparecer {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulso {

            0%, 100% {
                box-shadow:
                    0 8px 20px rgba(0,0,0,.2);
            }

            50% {
                box-shadow:
                    0 8px 30px rgba(255,193,7,.7);
            }
        }

        @keyframes tituloEntrada {

            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes crecerTallo {

            from {
                transform: scaleY(0) rotate(-8deg);
            }

            to {
                transform: scaleY(1) rotate(-8deg);
            }
        }

        @keyframes hojaEntrada {

            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
            }
        }

        @keyframes florEntrada {

            0% {
                transform: scale(0) rotate(-90deg);
                opacity: 0;
            }

            70% {
                transform: scale(.65) rotate(15deg);
            }

            100% {
                transform: scale(.55) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes papelEntrada {

            from {
                opacity: 0;
                transform: translateY(80px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes mensajeEntrada {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes caer {

            from {
                transform:
                    translateY(-30px)
                    rotate(0deg);
                opacity: 1;
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
                opacity: 0;
            }
        }

        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 600px) {

            .hola {
                font-size: 58px;
            }

            .detalle {
                font-size: 20px;
            }

            .titulo {
                font-size: 30px;
                margin-top: 25px;
            }

            .ramo {
                transform: scale(.75);
                margin-top: -25px;
                margin-bottom: -80px;
            }

            .mensaje {
                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         PRIMERA PANTALLA
    ================================== -->

    <div id="inicio">

        <div class="hola">
            ¡HOLA! 🌈
        </div>

        <div class="detalle">
            Este es un detalle para ti ✨
        </div>

        <button
            class="boton"
            onclick="mostrarSorpresa()">

            Haz click aquí para ver 🌻

        </button>

    </div>



    <!-- =================================
         SEGUNDA PANTALLA
    ================================== -->

    <div id="sorpresa">

        <div class="titulo">
            🌻 Para mi amiga Beatriz 🌻
        </div>

        <div class="subtitulo">
            Un pequeño detalle de amistad ✨
        </div>


        <div class="ramo">

            <!-- Tallos -->

            <div class="tallo"></div>
            <div class="tallo tallo2"></div>
            <div class="tallo tallo3"></div>


            <!-- Hojas -->

            <div class="hoja hoja1"></div>
            <div class="hoja hoja2"></div>
            <div class="hoja hoja3"></div>


            <!-- Flores -->

            <div class="flor flor1"></div>
            <div class="flor flor2"></div>
            <div class="flor flor3"></div>
            <div class="flor flor4"></div>
            <div class="flor flor5"></div>
            <div class="flor flor6"></div>


            <!-- Papel -->

            <div class="papel"></div>


            <!-- Lazo -->

            <div class="lazo"></div>

        </div>


        <div class="mensaje">

            🌼 Espero que te gusten estas flores amarillas 🌼

        </div>

    </div>



    <script>

        function mostrarSorpresa() {

            const inicio =
                document.getElementById("inicio");

            const sorpresa =
                document.getElementById("sorpresa");


            /* Desaparece la pantalla inicial */

            inicio.style.animation =
                "entrada .8s reverse forwards";


            setTimeout(function() {

                inicio.style.display = "none";

                sorpresa.style.display = "block";

                setTimeout(function() {

                    sorpresa.classList.add("mostrar");

                    crearPetalos();

                }, 50);

            }, 800);

        }



        function crearPetalos() {

            for (let i = 0; i < 35; i++) {

                const petalo =
                    document.createElement("div");

                petalo.className = "petalo";

                petalo.innerHTML =
                    Math.random() > .5
                    ? "🌼"
                    : "🌻";


                petalo.style.left =
                    Math.random() * 100 + "vw";


                petalo.style.animationDuration =
                    (3 + Math.random() * 5) + "s";


                petalo.style.animationDelay =
                    Math.random() * 3 + "s";


                petalo.style.fontSize =
                    (15 + Math.random() * 20) + "px";


                document.body.appendChild(petalo);


                setTimeout(function() {

                    petalo.remove();

                }, 9000);

            }

        }

    </script>


</body>

</html>
